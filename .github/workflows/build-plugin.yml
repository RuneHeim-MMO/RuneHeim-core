name: Build Minecraft Plugin

on:
  push:
    branches:
      - main

jobs:
  compile:
    runs-on: ubuntu-latest
    outputs:
      jar-path: ${{ steps.upload-artifact.outputs.path }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 21

      - name: Cache Gradle packages
        id: gradle-cache
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Clean and build with Gradle
        run: ./gradlew clean build

      - name: Upload JAR artifact
        id: upload-artifact
        uses: actions/upload-artifact@v4
        with:
          name: RuneHeim-core
          path: build/libs/*.jar

  push:
    runs-on: ubuntu-latest
    needs: compile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Restore Gradle cache
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Download JAR artifact
        uses: actions/download-artifact@v3
        with:
          name: RuneHeim-core
          path: build/libs/

      - name: Send HTTP POST to Minecraft Hook
        run: |
          curl --max-time 30 -X POST "http://65.21.193.214:81/restart?key=${{ secrets.WEB_HOOK_SECRET }}&seconds=300&reason=Core%20Update&sender=Github_actions"
