import com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar

plugins {
    id 'java'
    id("xyz.jpenilla.run-paper") version "2.3.1"
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

group = 'org.zuma'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
    maven {
        name = "sonatype"
        url = "https://oss.sonatype.org/content/groups/public/"
    }
    maven { url = 'https://jitpack.io' }
    maven { url = "https://repo.enginehub.org/repo/" }
    maven {
        name = 'ProtocolLib Repo'
        url = 'https://repo.dmulloy2.net/repository/public/'
    }
    maven {
        url "https://repo.md-5.net/content/groups/public/"
    }
    maven { url 'https://repo.bluecolored.de/releases' }
    maven { url = "https://repo.enginehub.org/repo/" }
}

build.dependsOn shadowJar

dependencies {
    compileOnly group: 'me.libraryaddict.disguises', name: 'libsdisguises', version: '11.0.9'
    compileOnly("io.papermc.paper:paper-api:1.21.4-R0.1-SNAPSHOT")
    compileOnly("com.github.decentsoftware-eu:decentholograms:2.8.17")
    compileOnly 'com.sk89q.worldedit:worldedit-bukkit:7.3.11'
    compileOnly 'de.bluecolored:bluemap-api:2.7.4'
    implementation 'com.google.code.gson:gson:2.11.0'
    implementation 'io.github.cdimascio:dotenv-java:3.2.0'
    implementation 'com.zaxxer:HikariCP:5.1.0'
    implementation 'io.lettuce:lettuce-core:6.2.1.RELEASE'
    compileOnly 'com.sk89q.worldguard:worldguard-bukkit:7.0.13'
    compileOnly files('libs/packetevents-spigot-2.9.5.jar')
    compileOnly files('libs/ProtocolLib.jar')
    compileOnly files('libs/ModelEngine-4.0.8.jar')
    compileOnly files("libs/ServerTours-2.1.8.jar")
}


tasks {
    tasks.named("shadowJar", com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar).configure {
        archiveFileName.set("${project.name}-${project.version}.jar")
    }
    tasks.register("devBuild", ShadowJar) {
        archiveFileName.set("dev-core.jar")
        destinationDirectory.set(file("/home/sp/Desktop/RuneHeim/game-server-template/server/plugins"))
        from sourceSets.main.output
        configurations = [project.configurations.runtimeClasspath]
    }
    tasks.jar {
        enabled = false
    }
    runServer {
        // Configure the Minecraft version for our task.
        // This is the only required configuration besides applying the plugin.
        // Your plugin's jar (or shadowJar if present) will be used automatically.
        minecraftVersion("1.21")
    }
}

def targetJavaVersion = 21
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'

    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}
