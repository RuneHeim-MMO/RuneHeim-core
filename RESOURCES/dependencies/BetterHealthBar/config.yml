debug: false
metrics: false
pack-type: folder
namespace: betterhealthbar
default-duration: 60
build-folder: BetterHealthBar/build
default-height: 0.65
look-degree: 20
look-distance: 15
merge-other-folder: []
enable-self-host: false
self-host-port: 8163
number-format: '#,###.0'
blacklist-entity-type:
- ARMOR_STAND
- TEXT_DISPLAY
- BLOCK_DISPLAY
- ITEM_DISPLAY
disable-to-vehicle-mob: true
disable-to-invulnerable-mob: true
disable-to-invisible-mob: false
shaders:
  text:
    vsh: true
    fsh: true
use-core-shaders: true
show-me-healthbar: false
resource-pack-obfuscation: false
plugin-version: 3.9.2
